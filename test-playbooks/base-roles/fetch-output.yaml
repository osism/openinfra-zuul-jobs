- name: Run the fetch-output role
  hosts: all
  pre_tasks:
    # ensure-output-dirs is run before this
    - name: Write test log file
      copy:
        dest: '{{ zuul_output_dir }}/{{ item }}/{{ inventory_hostname }}'
        content: '{{ item }}'
      loop:
        - logs
        - docs
        - artifacts
  roles:
    - role: fetch-output
  post_tasks:
    - name: Check that logs have been pulled
      delegate_to: localhost
      file:
        # log_path fact is set in fetch-output
        path: "{{ log_path }}/{{ inventory_hostname }}"
        state: file
      register: local_log_content

    - name: Check that artifacts have been pulled
      delegate_to: localhost
      file:
        path: "{{ zuul.executor.work_root }}/artifacts/{{ inventory_hostname }}"
        state: file
      register: local_artifact_content

    - name: Check that docs have been pulled
      delegate_to: localhost
      file:
        path: "{{ zuul.executor.work_root }}/docs/{{ inventory_hostname }}"
        state: file
      register: local_doc_content

    - name: Validate that files were pulled correctly
      assert:
        that:
          - local_log_content is not changed
          - local_log_content is succeeded
          - local_artifact_content is not changed
          - local_artifact_content is succeeded
          - local_doc_content is not changed
          - local_doc_content is succeeded

- name: Test fetch-output role with rsync options
  hosts: all
  pre_tasks:
    - name: Create a test file for rsync log verification
      copy:
        # Content is 2 KiB of 'x' characters to trigger human-readable suffixes
        content: "{{ 'x' * 2048 }}"
        dest: '{{ zuul_output_dir }}/logs/rsync-opts-test.txt'
  roles:
    - role: fetch-output
      fetch_output_rsync_quiet: true
      fetch_output_rsync_stats: true
      fetch_output_rsync_human_readable: true
      fetch_output_rsync_log_file: true
  post_tasks:
    - name: Read the rsync log file
      delegate_to: localhost
      slurp:
        src: "{{ zuul.executor.log_root }}/fetch-output.log"
      register: rsync_log

    - name: Validate rsync log file contents
      vars:
        log_content: "{{ rsync_log.content | b64decode }}"
      assert:
        that:
          - "'rsync-opts-test.txt' in log_content"
          - "'Number of files' in log_content"
          - "log_content | regex_search('[0-9.]+[KMG] bytes')"

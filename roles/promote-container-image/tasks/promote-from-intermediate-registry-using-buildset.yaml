- name: Set current buildset
  set_fact:
    promote_container_image_buildset: "{{ zuul.buildset }}"
  when: promote_container_image_same_buildset | default(false) | bool

- name: Query Zuul API for buildset
  uri:
    url: "{{ promote_container_image_api }}/buildsets?change={{ zuul.change }}&patchset={{ zuul.patchset }}&pipeline={{ promote_container_image_pipeline }}&result=SUCCESS"
  register: buildset_response
  when: promote_container_image_buildset is undefined

- name: Parse buildset response
  set_fact:
    promote_container_image_buildset: "{{ buildset_response.json[0].uuid }}"
  when: promote_container_image_buildset is undefined

- name: Query Zuul API for buildset builds
  uri:
    url: "{{ promote_container_image_api }}/buildset/{{ promote_container_image_buildset }}"
  register: buildset_builds

- name: Find a successful build of the job from the buildset
  set_fact:
    candidate_builds: >-
      {{ buildset_builds.json.builds
         | selectattr('job_name', 'equalto', promote_container_image_job)
         | selectattr('result', 'equalto', 'SUCCESS')
         | list }}

- name: Query Zuul API for image information
  uri:
    url: "{{ promote_container_image_api }}/build/{{ candidate_builds[0].uuid }}"
  register: build

- name: Map image artifacts
  set_fact:
    zj_artifact_map: "{{ zj_artifact_map | default({}) | combine({zj_map_item.metadata.repository + ':' + zj_map_item.metadata.tag: zj_map_item.url}) }}"
  loop_control:
    loop_var: zj_map_item
  loop: "{{ build.json | json_query(\"artifacts[?metadata.type=='container_image']\")}}"

- name: Promote image
  loop: "{{ container_images }}"
  loop_control:
    loop_var: zj_image
  include_tasks: promote-registry.yaml
